
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Single Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Product Section */

        .product-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 50px 0;
        }

        /* Product Image */

        .product-image {
            overflow: hidden;
            border-radius: 15px;
        }

        .product-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.4s;
        }

        .product-image img:hover {
            transform: scale(1.05);
        }

        /* Product Content */

        .product-content {
            padding: 30px;
        }

        .category {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .product-content h1 {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .price {
            color: #198754;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            color: #777;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        /* Product Information */

        .product-info p {
            margin-bottom: 12px;
            color: #555;
        }

        /* Buy Button */

        .buy-btn {
            background-color: #222;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: #198754;
        }

        /* Responsive */

        @media (max-width: 767px) {

            .product-section {
                padding: 30px 0;
            }

            .product-image img {
                height: 350px;
            }

            .product-content {
                padding: 25px 5px;
            }

            .product-content h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

    </nav>
